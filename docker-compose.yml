version: "3.9"

services:
  app:
    build: .
    container_name: ecommerce_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:15
    container_name: ecommerce_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rekha@123
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:7
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    restart: always
